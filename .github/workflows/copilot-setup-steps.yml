# Development environment for the GitHub Copilot cloud coding agent.
# The job name and file path are required by GitHub.
name: Copilot Setup Steps

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    name: Prepare Copilot development environment
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Restore backend dependencies
        run: dotnet restore ServiceDesk.slnx

      - name: Restore local .NET tools
        run: dotnet tool restore

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci
